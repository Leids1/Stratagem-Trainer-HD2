<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Trainer Helldivers 2</title>
    <link rel="icon" href="img/icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, input, select, button { font-family: 'Rajdhani', sans-serif; font-weight: 600; }

        body {
            background-color: #0f1115;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .mode-btn, .settings-btn, .key-btn, label, .arrow, .checkbox-container, .stat-label {
            user-select: none;
        }

        .crt-text {
            text-shadow: -1px 0 0 rgba(255,0,0,0.8), 1px 0 0 rgba(0,180,255,0.8);
            letter-spacing: 0.5px;
        }

        /* --- ЛЕВАЯ ПАНЕЛЬ --- */
        #sidebar {
            width: 380px;
            background-color: #1a1c20;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 30; 
        }

        .sidebar-header {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 15px 20px; font-size: 16px; font-weight: 700;
        }

        .checkbox-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ffe800; cursor: pointer; }

        #search-container { padding: 0 20px 15px 20px; border-bottom: 2px solid #333; }
        #search-input {
            width: 100%; padding: 8px 12px; background-color: #2a2c31;
            border: 1px solid #444; color: white; font-size: 16px; outline: none;
        }
        #search-input::placeholder { color: #888; }

        #categories-list { flex-grow: 1; overflow-y: auto; padding: 15px 20px; }
        #categories-list::-webkit-scrollbar { width: 5px; }
        #categories-list::-webkit-scrollbar-thumb { background: #444; }

        .category { margin-bottom: 25px; }
        .category-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px;
        }

        .stratagem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .stratagem-item {
            aspect-ratio: 1; background-color: #2a2c31; border: 2px solid #444;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s; position: relative; user-select: none;
        }
        .stratagem-item img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }
        .stratagem-item.active { border-color: #ffe800; background-color: #3a3c41; }
        .stratagem-item:not(.active) { opacity: 0.4; }

        /* --- ОСНОВНАЯ ПАНЕЛЬ --- */
        #main-content {
            flex-grow: 1; display: flex; flex-direction: column; position: relative; z-index: 1;
        }

        #top-bar {
            display: flex; justify-content: space-between; padding: 20px 30px;
            font-weight: 700; font-size: 18px; border-bottom: 1px solid #222;
            position: relative; z-index: 20; background-color: #0f1115;
        }

        .mode-toggles { display: flex; gap: 20px; }
        .mode-btn { cursor: pointer; color: #888; transition: color 0.2s; }
        .mode-btn.active { color: #ffe800; text-shadow: 0 0 10px rgba(255, 232, 0, 0.3); }
        .mode-btn:hover { color: #fff; }

        .settings-btn { color: #ffe800; cursor: pointer; transition: transform 0.2s; }
        .settings-btn:hover { transform: scale(1.05); }

        #game-area {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative;
            background: linear-gradient(rgba(15, 17, 21, 0.85), rgba(15, 17, 21, 0.85)), url('img/background1.png') center/cover no-repeat;
        }

        #stats-panel {
            display: flex; justify-content: space-between; align-items: center;
            width: 600px; margin-bottom: 40px;
        }

        .stat-block { text-align: center; font-weight: 700; }
        .stat-label { font-size: 24px; color: #fff; text-transform: uppercase; }
        .stat-value { font-size: 54px; color: #ffe800; line-height: 1; text-shadow: 0 0 15px rgba(255,232,0,0.3); }
        .record-label { font-size: 16px; color: #888; margin-top: 5px; user-select: none; }
        .record-label span { color: #ffe800; }

        #upcoming-container {
            display: none; flex-direction: row; gap: 10px; margin-bottom: 15px; height: 50px;
        }
        
        .upcoming-item {
            width: 50px; height: 50px; background-color: #2a2c31; border: 2px solid #444;
            display: flex; align-items: center; justify-content: center; opacity: 0.6;
            transition: all 0.3s ease;
        }
        
        .upcoming-item img {
            width: 80%; height: 80%; object-fit: contain; pointer-events: none;
        }

        #timer-bar-container {
            width: 100%; height: 45px; background-color: #222; position: relative;
            display: flex; align-items: center; justify-content: center;
            border-top: 3px solid #000; border-bottom: 3px solid #000;
        }
        #timer-fill {
            position: absolute; left: 0; top: 0; height: 100%; background-color: #ffe800;
            width: 100%; transition: background-color 0.3s;
        }
        #timer-text { position: relative; z-index: 1; color: #000; font-weight: 700; font-size: 22px; letter-spacing: 2px; }

        #active-stratagem { margin-top: 50px; display: flex; flex-direction: column; align-items: center; min-height: 200px; position: relative; }
        #active-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px; }
        #active-name { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

        #arrows-container { display: flex; align-items: center; justify-content: center; }
        .arrow-wrapper { position: relative; display: flex; align-items: center; }
        .arrow { font-size: 50px; color: #444; font-weight: bold; font-family: sans-serif; padding: 0 5px; margin: 0; }
        .arrow.active { color: #ffe800; text-shadow: 0 0 15px #ffe800; }
        .arrow.completed { color: #fff; }
        .arrow.inactive { opacity: 0.15 !important; }
        
        .gap { 
            position: absolute; right: 0; transform: translateX(50%); 
            width: 24px; height: 60px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 10; 
        }
        .gap::after { 
            content: ''; position: absolute; 
            width: 4px; height: 40px; background: transparent; 
            border-radius: 2px; transition: background 0.2s, height 0.2s; 
        }
        .gap:hover::after { background: rgba(255,255,255,0.2); }
        .gap.is-split::after { height: 60px; background: #ffe800; }
        
        /* Обновленная кнопка разделения */
        .gap-triangle { 
            position: absolute; bottom: -28px; 
            background: #2a2c31; border: 1px solid #444; color: #ffe800; 
            font-size: 14px; padding: 2px 8px; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .gap-triangle:hover { 
            background: #ffe800; color: #000; transform: scale(1.1); 
        }

        /* Обновленное меню разделения с отступами и крестиком */
        #split-menu {
            position: absolute; top: calc(100% + 20px); left: 50%; transform: translateX(-50%);
            background: #1a1c20; border: 2px solid #ffe800; padding: 25px 15px 15px 15px; display: flex; flex-direction: column; gap: 8px; z-index: 50;
            border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .close-cross {
            position: absolute; top: 5px; right: 8px; color: #888; 
            font-size: 14px; cursor: pointer; transition: color 0.2s;
            font-family: sans-serif; user-select: none;
        }
        .close-cross:hover { color: #ff0000; }

        #split-menu button {
            background: #2a2c31; color: white; border: 1px solid #444; padding: 8px 12px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px; transition: 0.2s;
        }
        #split-menu button:hover { background: #ffe800; color: #000; }
        #split-menu input {
            width: 60px; padding: 8px; background: #222; color: #fff; border: 1px solid #444; text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px; outline: none;
        }
        #split-menu input:focus { border-color: #ffe800; }
        
        #rep-counter { margin-bottom: 15px; font-size: 22px; color: #ffe800; font-weight: bold; display: none; text-shadow: 0 0 10px rgba(255,232,0,0.4); }

        .error-state { color: #ff0000 !important; text-shadow: 0 0 15px #ff0000 !important; }
        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        #overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 17, 21, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        #overlay h1 { font-size: 60px; margin-bottom: 20px; color: #ffe800; text-shadow: 0 0 20px rgba(255,232,0,0.4); text-align: center; }
        #overlay p { font-size: 24px; color: #ccc; margin-bottom: 10px; text-align: center; }

        /* --- ОКНО НАСТРОЕК --- */
        #settings-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .settings-box {
            background: #1a1c20; border: 4px solid #ffe800; padding: 40px; width: 450px;
            box-shadow: 0 0 30px rgba(255, 232, 0, 0.2);
        }
        .settings-box h2 {
            font-size: 32px; color: #ffe800; margin-bottom: 30px; text-align: center; text-transform: uppercase;
        }
        .setting-row { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; }
        .setting-row label { font-size: 18px; color: #fff; }
        .setting-row select, .setting-row input[type="number"] {
            font-size: 18px; padding: 12px; background: #2a2c31; color: #fff; border: 2px solid #444; outline: none; cursor: pointer;
        }
        .setting-row select:focus, .setting-row input[type="number"]:focus { border-color: #ffe800; }
        
        #btn-close-settings {
            width: 100%; font-size: 20px; padding: 15px; background: #ffe800; color: #000; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: background 0.2s;
        }
        #btn-close-settings:hover { background: #fff; }
        
        .key-btn {
            background: #2a2c31; border: 2px solid #444; color: #fff;
            width: 55px; height: 55px; font-size: 20px; font-weight: bold;
            cursor: pointer; border-radius: 5px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .key-btn:hover { border-color: #ffe800; color: #ffe800; }
        .key-btn.recording { background: #ffe800; color: #000; border-color: #fff; animation: blinker 1s infinite; }
        
        @keyframes blinker { 50% { opacity: 0.5; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <label class="checkbox-container">
                <span id="lbl-select-all">ВЫБРАТЬ ВСЕ</span>
                <input type="checkbox" id="select-all">
            </label>
        </div>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Поиск стратагем...">
        </div>
        <div id="categories-list"></div>
    </div>

    <div id="main-content">
        <div id="top-bar">
            <div class="mode-toggles">
                <span id="btn-mode-game" class="mode-btn active" onclick="setMode('game')">ИГРА</span>
                <span id="btn-mode-practice" class="mode-btn" onclick="setMode('practice')">ТРЕНИРОВКА</span>
            </div>
            <span class="settings-btn" id="btn-settings" onclick="openSettings()">НАСТРОЙКИ ⚙</span>
        </div>

        <div id="game-area">
            <div id="stats-panel">
                <div class="stat-block">
                    <div class="stat-label crt-text" id="lbl-round">Раунд</div>
                    <div class="stat-value" id="ui-round">1</div>
                </div>
                <div class="stat-block">
                    <div class="stat-value" id="ui-score">0</div>
                    <div class="stat-label crt-text" id="lbl-score">Счет</div>
                    <div class="record-label"><span id="lbl-record">Рекорд : </span><span id="ui-record">0</span></div>
                </div>
            </div>

            <div id="upcoming-container"></div>

            <div id="timer-bar-container">
                <div id="timer-fill"></div>
                <div id="timer-text">ВЫБЕРИТЕ РЕЖИМ</div>
            </div>

            <div id="active-stratagem">
                <img id="active-img" src="" alt="" onerror="this.style.opacity='0'">
                <div id="active-name">выбери стратаген слева</div>
                
                <div id="rep-counter"></div>
                <div id="arrows-container"></div>
                
                <div id="split-menu" class="hidden">
                    <span class="close-cross" onclick="closeSplitMenu()">✖</span>
                    <div style="display: flex; gap: 5px;">
                        <button id="btn-split-left" onclick="setSplitPart(1)">ЛЕВАЯ ПОЛОВИНА</button>
                        <button id="btn-split-right" onclick="setSplitPart(2)">ПРАВАЯ ПОЛОВИНА</button>
                    </div>
                    <div style="display:flex; gap:5px; margin-top:5px; align-items: center; justify-content: center;">
                        <label style="color:#fff; font-size: 16px;">ПОВТОРЫ:</label>
                        <input type="number" id="split-rep-input" min="1" value="1" oninput="applySplitReps()">
                    </div>
                </div>
            </div>

            <div id="overlay">
                <h1 id="overlay-title">ОЖИДАНИЕ ВВОДА</h1>
                <p id="overlay-desc">Нажмите любую клавишу перемещения</p>
                <p id="overlay-sub" style="font-size: 18px; color: #666;">Нажмите [ESC] чтобы прервать сессию</p>
            </div>
        </div>
        
        <div id="settings-modal" class="hidden">
            <div class="settings-box">
                <h2 id="settings-title">НАСТРОЙКИ</h2>
                
                <div class="setting-row">
                    <label id="lbl-lang">ЯЗЫК / LANGUAGE:</label>
                    <select id="setting-lang" onchange="changeLang(this.value)">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                    </select>
                </div>
                
                <div class="setting-row">
                    <label id="lbl-input">УПРАВЛЕНИЕ / INPUT:</label>
                    <select id="setting-input" onchange="changeInputMode(this.value)">
                        <option value="both" id="opt-input-both">WASD + Стрелки</option>
                        <option value="wasd" id="opt-input-wasd">Только WASD</option>
                        <option value="arrows" id="opt-input-arrows">Только Стрелки</option>
                        <option value="custom" id="opt-input-custom">Свои кнопки</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label id="lbl-timer-speed">СКОРОСТЬ ТАЙМЕРА (СЕК):</label>
                    <input type="number" id="setting-timer-speed" min="1" max="100" onchange="changeTimerSpeed(this.value)">
                </div>

                <div class="setting-row" id="custom-keys-row" style="display: none; align-items: center;">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 10px;">
                        <button class="key-btn" id="btn-key-up" onclick="recordKey('up')">W</button>
                        <div style="display: flex; gap: 5px;">
                            <button class="key-btn" id="btn-key-left" onclick="recordKey('left')">A</button>
                            <button class="key-btn" id="btn-key-down" onclick="recordKey('down')">S</button>
                            <button class="key-btn" id="btn-key-right" onclick="recordKey('right')">D</button>
                        </div>
                    </div>
                    <p id="lbl-custom-hint" style="font-size: 14px; color: #888; margin-top: 5px; text-align: center;">Кликните на кнопку, чтобы назначить</p>
                </div>
                
                <button id="btn-close-settings" onclick="closeSettings()">ЗАКРЫТЬ</button>
            </div>
        </div>
    </div>

    }
    
    function getEndIdx() {
        if (splitState.index === -1) return currentStratagem ? currentStratagem.seq.length : 0;
        return splitState.activePart === 1 ? splitState.index : currentStratagem.seq.length;
    }

    function formatKeyCode(code) {
        if (!code) return '';
        if (code.startsWith('Key')) return code.replace('Key', '');
        if (code.startsWith('Digit')) return code.replace('Digit', '');
        if (code.startsWith('Arrow')) {
            const arr = { 'ArrowUp': '↑', 'ArrowDown': '↓', 'ArrowLeft': '←', 'ArrowRight': '→' };
            return arr[code];
        }
        if (code === 'Space') return 'SPACE';
        if (code.startsWith('Shift')) return 'SHIFT';
        if (code.startsWith('Control')) return 'CTRL';
        if (code.startsWith('Alt')) return 'ALT';
        return code.toUpperCase();
    }

    // --- БОКОВАЯ ПАНЕЛЬ И ВЫБОР ---
    function renderSidebar() {
        const container = document.getElementById('categories-list');
        container.innerHTML = '';
        const categories = [...new Set(db.map(s => s.cat))];
        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        const currentPool = getActivePool();

        categories.forEach(catId => {
            const catStrats = db.filter(s => s.cat === catId && (currentLang === 'ru' ? s.name_ru : s.name_en).toLowerCase().includes(searchQuery));
            if (catStrats.length === 0) return;

            const catActiveCount = catStrats.filter(s => currentPool.some(a => a.id === s.id)).length;
            const isCatChecked = catActiveCount > 0 && catActiveCount === catStrats.length;

            const catDiv = document.createElement('div');
            catDiv.className = 'category';
            const header = document.createElement('div');
            header.className = 'category-header crt-text';
            header.innerHTML = `<span>${t(catId)}</span><input type="checkbox" class="cat-checkbox" data-cat="${catId}" ${isCatChecked ? 'checked' : ''}>`;
            catDiv.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'stratagem-grid';

            catStrats.forEach(s => {
                const item = document.createElement('div');
                const isActive = currentPool.some(a => a.id === s.id);
                item.className = isActive ? 'stratagem-item active' : 'stratagem-item';
                item.dataset.id = s.id;
                
                const img = document.createElement('img');
                img.src = s.img;
                img.onerror = () => img.style.opacity = '0';
                item.appendChild(img);
                
                item.onclick = () => {
                    const isNowActive = item.classList.toggle('active');
                    const pool = getActivePool();
                    if (isNowActive) {
                        if (!pool.some(a => a.id === s.id)) pool.push(s);
                    } else {
                        const index = pool.findIndex(a => a.id === s.id);
                        if (index > -1) pool.splice(index, 1);
                    }
                    updateActivePoolUI();
                };
                
                item.onmouseenter = () => {
                    if (selectedMode === 'practice') {
                        const activeImg = document.getElementById('active-img');
                        activeImg.src = s.img;
                        activeImg.style.opacity = '1';
                        document.getElementById('active-name').textContent = currentLang === 'ru' ? s.name_ru : s.name_en;
                        
                        const container = document.getElementById('arrows-container');
                        container.innerHTML = '';
                        s.seq.forEach((dir) => {
                            const span = document.createElement('span');
                            span.textContent = arrowSymbols[dir];
                            span.className = 'arrow';
                            container.appendChild(span);
                        });
                    }
                };
                
                item.onmouseleave = () => {
                    if (selectedMode === 'practice') {
                        if (currentStratagem) {
                            updateActiveUI();
                        } else {
                            document.getElementById('active-img').style.opacity = '0';
                            document.getElementById('active-name').textContent = t('loading');
                            document.getElementById('arrows-container').innerHTML = '';
                        }
                    }
                };

                grid.appendChild(item);
            });

            catDiv.appendChild(grid);
            container.appendChild(catDiv);
        });

        // Обработчики чекбоксов категорий
        document.querySelectorAll('.cat-checkbox').forEach(cb => {
            cb.onchange = (e) => {
                const catId = e.target.dataset.cat;
                const pool = getActivePool();
                const checked = e.target.checked;
                
                db.filter(s => s.cat === catId).forEach(s => {
                    const index = pool.findIndex(a => a.id === s.id);
                    if (checked && index === -1) pool.push(s);
                    else if (!checked && index > -1) pool.splice(index, 1);
                });
                
                document.querySelectorAll('.stratagem-item').forEach(item => {
                    if (db.find(s => s.id === item.dataset.id).cat === catId) {
                        checked ? item.classList.add('active') : item.classList.remove('active');
                    }
                });
                updateActivePoolUI();
            };
        });
    }

    // --- ОЧЕРЕДЬ СТРАТАГЕМ ---
    function renderUpcomingQueue() {
        const container = document.getElementById('upcoming-container');
        container.innerHTML = '';
        if ((selectedMode !== 'game' || state !== 'playing') && state !== 'practice') {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'flex';
        
        upcomingQueue.forEach(s => {
            const div = document.createElement('div');
            div.className = 'upcoming-item';
            const img = document.createElement('img');
            img.src = s.img;
            div.appendChild(img);
            container.appendChild(div);
        });

    function startGame() {
        const pool = getActivePool();
        if (pool.length === 0) return alert(t('alertSelect'));
        state = 'playing';
        score = 0; round = 1; stratagemsInRound = 0; 
        MAX_TIME = timerSpeed * 1000;
        timeLeft = MAX_TIME; inputLocked = false;
        
        upcomingQueue = [];
        for (let i = 0; i < UPCOMING_COUNT; i++) {
            upcomingQueue.push(pool[Math.floor(Math.random() * pool.length)]);
        }
        
        document.getElementById('stats-panel').style.display = 'flex';
        document.getElementById('ui-score').textContent = score;
        document.getElementById('ui-round').textContent = round;
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('timer-text').textContent = '';
        
        nextRandomStratagem();
        lastTime = performance.now();
        timerId = requestAnimationFrame(gameLoop);
    }

    function gameLoop(timestamp) {
        if (state !== 'playing') return;
        const dt = timestamp - lastTime; lastTime = timestamp;
        timeLeft -= dt * (1 + (round * 0.1)); 

        const pct = Math.max(0, (timeLeft / MAX_TIME) * 100);
        const timerFill = document.getElementById('timer-fill');
        const timerText = document.getElementById('timer-text');
        
        timerFill.style.width = `${pct}%`;

        if (pct < 30) {
            timerFill.style.backgroundColor = '#ff0000';
            timerText.textContent = t('timeOut');
            timerText.style.color = '#fff';
        } else {
            timerFill.style.backgroundColor = '#ffe800';
            timerText.textContent = '';
        }

        if (timeLeft <= 0) endGame();
        else timerId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        if (score > record) {
            record = score;
            localStorage.setItem('stratagem_record', record);
            document.getElementById('ui-record').textContent = record;
        }
        document.getElementById('upcoming-container').style.display = 'none';
        document.getElementById('timer-text').textContent = t('traitor');
        document.getElementById('timer-text').style.color = '#000';
        document.getElementById('timer-fill').style.width = '100%';
        document.getElementById('timer-fill').style.backgroundColor = '#ffe800';
        showOverlay(t('gameOver'), t('restart').replace('{s}', score));
        state = 'gameover';
    }

    function startPractice() {
        const pool = getActivePool();
        if (pool.length === 0) {
            currentStratagem = null;
            document.getElementById('active-img').style.opacity = '0';
            document.getElementById('active-name').textContent = t('alertSelect');
            document.getElementById('arrows-container').innerHTML = '';
            upcomingQueue = [];
            renderUpcomingQueue();
        }
        
        state = 'practice';
        practiceIndex = 0; inputLocked = false;
        
        document.getElementById('stats-panel').style.display = 'none';
        document.getElementById('overlay').classList.add('hidden');
        
        document.getElementById('timer-fill').style.width = '100%';
        document.getElementById('timer-fill').style.backgroundColor = '#2a2c31';
        const timerText = document.getElementById('timer-text');
        timerText.textContent = t('practiceActive');
        timerText.style.color = '#888';

        cancelAnimationFrame(timerId);
        if (pool.length > 0) loadPracticeStratagem();
    }

    function loadPracticeStratagem() {
        const pool = getActivePool();
        if (pool.length === 0) return;
        currentStratagem = pool[practiceIndex];
        
        splitState = { index: -1, activePart: 0, repetitions: 1, currentRep: 0 };
        closeSplitMenu();
        currentIndex = getStartIdx();
        
        upcomingQueue = [];
        for (let i = 1; i <= UPCOMING_COUNT; i++) {
            upcomingQueue.push(pool[(practiceIndex + i) % pool.length]);
        }
        renderUpcomingQueue();

        updateActiveUI();
    }

    function nextRandomStratagem() {
        const pool = getActivePool();
        
        if (selectedMode === 'game') {
            currentStratagem = upcomingQueue.shift();
            upcomingQueue.push(pool[Math.floor(Math.random() * pool.length)]);
            renderUpcomingQueue();
        } else {
            currentStratagem = pool[Math.floor(Math.random() * pool.length)];
        }
        
        splitState = { index: -1, activePart: 0, repetitions: 1, currentRep: 0 };
        closeSplitMenu();
        currentIndex = getStartIdx();
        
        updateActiveUI();
    }

    function updateActiveUI() {
        if (!currentStratagem) return;
        const img = document.getElementById('active-img');
        img.src = currentStratagem.img;
        img.style.opacity = '1';
        document.getElementById('active-name').textContent = currentLang === 'ru' ? currentStratagem.name_ru : currentStratagem.name_en;
        renderArrows();
    }

    function renderArrows(isError = false) {
        const container = document.getElementById('arrows-container');
        container.innerHTML = '';
        
        const startIdx = getStartIdx();
        const endIdx = getEndIdx();

        currentStratagem.seq.forEach((dir, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'arrow-wrapper';
            
            const span = document.createElement('span');
            span.textContent = arrowSymbols[dir];
            span.className = 'arrow';
            
            if (i < startIdx || i >= endIdx) {
                span.classList.add('inactive');
            } else {
                if (isError) span.classList.add('error-state');
                else if (i < currentIndex) span.classList.add('completed');
                else if (i === currentIndex) span.classList.add('active');
            }
            
            wrapper.appendChild(span);

            // Добавляем линию разделения, если это не последняя стрелочка
            if (i < currentStratagem.seq.length - 1) {
                const gapIdx = i + 1;
                const gap = document.createElement('div');
                gap.className = 'gap' + (splitState.index === gapIdx ? ' is-split' : '');
                
                if (splitState.index === gapIdx) {
                    const triangle = document.createElement('div');
                    triangle.className = 'gap-triangle';
                    triangle.textContent = '✂'; // Иконка ножниц вместо треугольника
                    triangle.onclick = (e) => {
                        e.stopPropagation();
                        openSplitMenu();
                    };
                    gap.appendChild(triangle);
                }
                
                gap.onclick = (e) => {
                    if (e.target.classList.contains('gap-triangle')) return;
                    e.stopPropagation(); 
                    
                    if (splitState.index === gapIdx) {
                        splitState = { index: -1, activePart: 0, repetitions: 1, currentRep: 0 };
                        closeSplitMenu();
                    } else {
                        // По умолчанию делаем активной левую половину, если кликнули впервые на эту позицию
                        splitState = { index: gapIdx, activePart: 1, repetitions: parseInt(document.getElementById('split-rep-input').value) || 1, currentRep: 0 };
                        updateSplitMenuUI();
                    }
                    currentIndex = getStartIdx();
                    renderArrows();
                };
                
                wrapper.appendChild(gap);
            }
            
            container.appendChild(wrapper);
        });

        const repDiv = document.getElementById('rep-counter');
        if (splitState.index !== -1 && splitState.repetitions > 1) {
            repDiv.style.display = 'block';
            repDiv.textContent = `ПОВТОР: ${splitState.currentRep + 1} / ${splitState.repetitions}`;
        } else {
            repDiv.style.display = 'none';
        }
    }

    // --- УНИВЕРСАЛЬНАЯ ОБРАБОТКА ВВОДА ---
    function processDirection(dir) {
        if (inputLocked) return;

        // Закрываем меню разделения, если игрок начал ввод
        const splitMenu = document.getElementById('split-menu');
        if (splitMenu && !splitMenu.classList.contains('hidden')) {
            closeSplitMenu();
        }

        if (state === 'menu' || state === 'gameover') {
            if (selectedMode === 'game') startGame();
            return;
        }

        if (state !== 'playing' && state !== 'practice') return;
        if (!currentStratagem) return; 

        const startIdx = getStartIdx();
        const endIdx = getEndIdx();

        if (currentIndex < startIdx) currentIndex = startIdx;

        if (dir === currentStratagem.seq[currentIndex]) {
            currentIndex++;
            
            if (currentIndex === endIdx) {
                splitState.currentRep++;
                if (splitState.currentRep < splitState.repetitions) {
                    currentIndex = startIdx;
                    renderArrows();
                } else {
                    splitState.currentRep = 0; 
                    
                    // Логика бесконечного чередования половин
                    if (splitState.index !== -1) {
                        // Меняем половину на противоположную (1 на 2, или 2 на 1)
                        splitState.activePart = splitState.activePart === 1 ? 2 : 1;
                        currentIndex = getStartIdx();
                        updateSplitMenuUI();
                        renderArrows();
                        return; // Прерываем дальнейшее выполнение
                    }
                    
                    if (state === 'playing') {
                        score += (endIdx - startIdx) * 10;
                        document.getElementById('ui-score').textContent = score;
                        timeLeft = Math.min(MAX_TIME, timeLeft + 1500); 
                        
                        stratagemsInRound++;
                        if (stratagemsInRound >= 5) {
                            round++;
                            stratagemsInRound = 0;
                            document.getElementById('ui-round').textContent = round;
                            timeLeft = Math.min(MAX_TIME, timeLeft + 2000); 
                        }
                        nextRandomStratagem(); 
                    } else if (state === 'practice') {
                        const pool = getActivePool();
                        practiceIndex = (practiceIndex + 1) % pool.length;
                        loadPracticeStratagem();
                    }
                }
            } else {
                renderArrows();
            }
        } else {
            currentIndex = startIdx;
            // Счетчик повторов больше не сбрасывается при ошибке!
            renderArrows(true);
            document.getElementById('game-area').classList.add('shake');
            
            if (state === 'playing') timeLeft -= 500; 
            
            inputLocked = true;
            setTimeout(() => {
                document.getElementById('game-area').classList.remove('shake');
                if (state === 'playing' || state === 'practice') renderArrows();
                inputLocked = false;
            }, 300);
        }
    }

    function processAction(action) {
        if (action === 'start') {
            if (state === 'menu' || state === 'gameover') {
                if (selectedMode === 'game') startGame();
            }
        } else if (action === 'prev') {
            if (state === 'practice' && getActivePool().length > 0) {
                const pool = getActivePool();
                practiceIndex = (practiceIndex - 1 + pool.length) % pool.length;
                loadPracticeStratagem();
            }
        } else if (action === 'next') {
            if (state === 'practice' && getActivePool().length > 0) {
                const pool = getActivePool();
                practiceIndex = (practiceIndex + 1) % pool.length;
                loadPracticeStratagem();
            }
        }
    }

    const keyToDir = { 
        'w': 'up', 'ц': 'up', 'arrowup': 'up',
        's': 'down', 'ы': 'down', 'arrowdown': 'down',
        'a': 'left', 'ф': 'left', 'arrowleft': 'left',
        'd': 'right', 'в': 'right', 'arrowright': 'right'
    };
    const practiceKeys = { 'q': -1, 'й': -1, 'e': 1, 'у': 1 };

    document.addEventListener('keydown', (e) => {
        if (recordingKey) {
            e.preventDefault();
            if (e.code === 'Escape') {
                document.getElementById('btn-key-' + recordingKey).classList.remove('recording');
                recordingKey = null;
                updateCustomKeysUI();
                return;
            }
            customKeys[recordingKey] = e.code;
            localStorage.setItem('stratagem_custom_keys', JSON.stringify(customKeys));
            document.getElementById('btn-key-' + recordingKey).classList.remove('recording');
            recordingKey = null;
            updateCustomKeysUI();
            return;
        }

        if (document.activeElement && ['INPUT', 'SELECT'].includes(document.activeElement.tagName)) {
            if (e.key === 'Escape') document.activeElement.blur(); 
            return;
        }

        if (state === 'settings') {
            if (e.key === 'Escape') closeSettings();
            return; 
        }
        
        const key = e.key.toLowerCase();

        if (key === '1') return setMode('game');
        if (key === '2') return setMode('practice');
        if (key === 'escape') {
            if (!document.getElementById('split-menu').classList.contains('hidden')) {
                closeSplitMenu();
                return;
            }
            if (selectedMode === 'game') return showOverlay(t('awaitingInput'), t('pressAnyKey'));
            return;
        }

        let dir = null;
        if (currentInputMode === 'custom') {
            if (e.code === customKeys.up) dir = 'up';
            else if (e.code === customKeys.down) dir = 'down';
            else if (e.code === customKeys.left) dir = 'left';
            else if (e.code === customKeys.right) dir = 'right';
        } else {
            dir = keyToDir[key];
            if (dir) {
                const isWASD = ['w','a','s','d','ц','ф','ы','в'].includes(key);
                const isArrows = ['arrowup','arrowdown','arrowleft','arrowright'].includes(key);
                
                if (currentInputMode === 'wasd' && !isWASD) dir = null;
                if (currentInputMode === 'arrows' && !isArrows) dir = null;
            }
        }

        if (dir) {
            e.preventDefault(); 
            processDirection(dir);
        } else if (key === ' ') {
            e.preventDefault();
            processAction('start');
        } else if (state === 'practice' && practiceKeys[key]) {
            e.preventDefault();
            practiceKeys[key] > 0 ? processAction('next') : processAction('prev');
        }
    });

    // --- ОБРАБОТКА СВАЙПОВ ---
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    document.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        
        const threshold = 30; // Минимальная длина свайпа
        let dx = touchEndX - touchStartX;
        let dy = touchEndY - touchStartY;
        
        if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return; // Игнорируем случайные касания

        let dir = null;
        if (Math.abs(dx) > Math.abs(dy)) {
            // Горизонтальный свайп
            if (dx > 0) dir = 'right';
            else dir = 'left';
        } else {
            // Вертикальный свайп
            if (dy > 0) dir = 'down';
            else dir = 'up';
        }
        
        if (dir) {
            processDirection(dir);
        }
    }, {passive: true});

    // --- ОБРАБОТКА ГЕЙМПАДА ---
    let previousGamepadState = { up: false, down: false, left: false, right: false, start: false, lb: false, rb: false };
    
    function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let anyGamepadPressed = false;

        for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (gp) {
                const axes = gp.axes;
                const buttons = gp.buttons;
                const deadzone = 0.5;

                if (!anyGamepadPressed) {
                    anyGamepadPressed = buttons.some(b => b && b.pressed) || Math.abs(axes[0]) > deadzone || Math.abs(axes[1]) > deadzone;
                }

                const up = (buttons[12] && buttons[12].pressed) || (axes[1] < -deadzone);
                const down = (buttons[13] && buttons[13].pressed) || (axes[1] > deadzone);
                const left = (buttons[14] && buttons[14].pressed) || (axes[0] < -deadzone);
                const right = (buttons[15] && buttons[15].pressed) || (axes[0] > deadzone);
                
                const start = (buttons[0] && buttons[0].pressed) || (buttons[9] && buttons[9].pressed);
                const lb = buttons[4] && buttons[4].pressed; // L1
                const rb = (buttons[5] && buttons[5].pressed) || (buttons[7] && buttons[7].pressed); // R1 или R2

                if (up && !previousGamepadState.up) processDirection('up');
                if (down && !previousGamepadState.down) processDirection('down');
                if (left && !previousGamepadState.left) processDirection('left');
                if (right && !previousGamepadState.right) processDirection('right');
                
                if (start && !previousGamepadState.start) processAction('start');
                if (lb && !previousGamepadState.lb) processAction('prev');
                if (rb && !previousGamepadState.rb) processAction('next');

                previousGamepadState = { up, down, left, right, start, lb, rb };
                break; 
            }
        }

        if (anyGamepadPressed && !gamepadDetected) {
            gamepadDetected = true;
        }

        requestAnimationFrame(pollGamepad);
    }
    
    requestAnimationFrame(pollGamepad);
    updateLanguageUI();
</script>
